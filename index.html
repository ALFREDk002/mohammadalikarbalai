    </main>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = [];
        const numStars = 150;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.2,
                alpha: Math.random(),
                speed: Math.random() * 0.01 + 0.005
            });
        }

        let shootingStar = null;

        function createShootingStar() {
            shootingStar = {
                x: Math.random() * width,
                y: 0,
                length: Math.random() * 80 + 50,
                speedX: Math.random() * 15 + 10,
                speedY: Math.random() * 8 + 6,
                alpha: 1
            };
        }

        setInterval(() => {
            if (!shootingStar) {
                createShootingStar();
            }
        }, 4000);

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }
                ctx.globalAlpha = Math.abs(star.alpha);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            if (shootingStar) {
                ctx.globalAlpha = shootingStar.alpha;
                
                let gradient = ctx.createLinearGradient(
                    shootingStar.x, shootingStar.y, 
                    shootingStar.x - shootingStar.length, shootingStar.y - (shootingStar.length * (shootingStar.speedY / shootingStar.speedX))
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.5, 'rgba(0, 191, 255, 0.5)');
                gradient.addColorStop(1, 'transparent');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(shootingStar.x, shootingStar.y);
                ctx.lineTo(
                    shootingStar.x - shootingStar.length, 
                    shootingStar.y - (shootingStar.length * (shootingStar.speedY / shootingStar.speedX))
                );
                ctx.stroke();

                shootingStar.x += shootingStar.speedX;
                shootingStar.y += shootingStar.speedY;

                if (shootingStar.x > width || shootingStar.y > height) {
                    shootingStar = null;
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
